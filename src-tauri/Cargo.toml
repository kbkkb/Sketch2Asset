[package]
name = "sketch2asset"
version = "2.0.0"
description = "Sketch2Asset v2 — AI Game Asset Forge Desktop Client"
authors = ["kb"]
edition = "2021"

[lib]
name = "sketch2asset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = "0.4"
dirs = "6"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "half", "api-24"] }
half = "2.1"
